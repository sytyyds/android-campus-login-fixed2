name: Build APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Build debug APK
        shell: bash
        run: |
          # Locate the directory that owns both the settings file and app module.
          PROJECT_DIR="$(dirname "$(find . -type f -path '*/app/build.gradle.kts' -print -quit)")"
          PROJECT_DIR="$(dirname "${PROJECT_DIR}")"
          echo "Gradle project: ${PROJECT_DIR}"
          test -f "${PROJECT_DIR}/settings.gradle.kts"
          test -f "${PROJECT_DIR}/build.gradle.kts"
          test -f "${PROJECT_DIR}/app/build.gradle.kts"
          echo '--- settings.gradle.kts ---'
          sed -n '1,120p' "${PROJECT_DIR}/settings.gradle.kts"
          echo '--- build.gradle.kts ---'
          sed -n '1,80p' "${PROJECT_DIR}/build.gradle.kts"
          gradle --no-daemon --stacktrace -p "${PROJECT_DIR}" :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: campus-auto-login-debug
          path: '**/app/build/outputs/apk/debug/app-debug.apk'
